# Release integrity for the platform wheel: a reproducible build, a keyless
# signature, and SLSA build provenance, using the workflow's own OIDC identity.
# Runs on a published release or a version tag. The whole repository, Ariadne
# included, is under one source-available non-commercial licence, so nothing is
# excluded from the wheel and the reproducible-build check verifies Ariadne is
# present rather than absent.
#
# This workflow runs on push (a release or tag) and has not yet been executed;
# the steps and pins are validated locally. A live signed release additionally
# needs the maintainer's release event to mint the OIDC identity.

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC identity for Sigstore signing and provenance
      attestations: write    # to record the build provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[release]"
      - name: Set a deterministic build timestamp from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Verify the wheel builds reproducibly and includes Ariadne
        run: python scripts/reproducible_build.py
      - name: Build the release wheel
        run: |
          rm -rf dist
          PYTHONHASHSEED=0 python -m build --wheel --outdir dist .
      - name: Sign the wheel with Sigstore (keyless, OIDC)
        run: python -m sigstore sign dist/*.whl
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.whl
      - name: Upload wheel, signature bundle, and attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dkg-release-artifacts
          path: |
            dist/*.whl
            dist/*.sigstore*
